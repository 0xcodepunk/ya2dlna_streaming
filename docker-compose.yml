x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api_service:
    image: ya2dlna_streaming
    build: .
    command: api
    volumes:
      # YA2DLNA_DATA_DIR — постоянная папка для данных вне рабочей
      # директории деплоя; без переменной — рядом с compose-файлом
      - ${YA2DLNA_DATA_DIR:-.}/logs:/app/logs
      - ${YA2DLNA_DATA_DIR:-.}/cache:/app/cache
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - DOCKER_ENV=true
    restart: unless-stopped
    logging: *default-logging
    network_mode: "host"

  dlna_server:
    # Образ собирает api_service: одна сборка на оба сервиса
    image: ya2dlna_streaming
    command: dlna
    volumes:
      - ${YA2DLNA_DATA_DIR:-.}/logs:/app/logs
      - ${YA2DLNA_DATA_DIR:-.}/cache:/app/cache
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - DOCKER_ENV=true
    restart: unless-stopped
    logging: *default-logging
    network_mode: "host"
